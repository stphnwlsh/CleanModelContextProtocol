services:
  api:
    build:
      context: .
      target: run
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "8080:8080"
    environment:
      DOTNET_ENVIRONMENT: docker
    volumes:
      - movie-reviews-data:/app/data
    networks:
      - cleanmodelcontextprotocol_network
    depends_on:
      - seq
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.12.0
    command: ["--web", "--transport", "http", "--server-url", "http://api:8080/mcp"]
    ports:
      - "127.0.0.1:6274:6274"
    networks:
      - cleanmodelcontextprotocol_network
    depends_on:
      - api
  seq:
    image: datalust/seq:2026.1.17473
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - cleanmodelcontextprotocol_network
volumes:
  movie-reviews-data:
networks:
  cleanmodelcontextprotocol_network:
    driver: bridge
