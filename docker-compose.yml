services:
  api:
    build:
      context: .
      target: run
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "8080:8080"
    environment:
      DOTNET_ENVIRONMENT: docker
    networks:
      - cleanmodelcontextprotocol_network
    depends_on:
      - seq
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - cleanmodelcontextprotocol_network
networks:
  cleanmodelcontextprotocol_network:
    driver: bridge
